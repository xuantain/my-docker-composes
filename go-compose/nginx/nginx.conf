events {}

http {
    server {
        listen 80;
        # listen 80 default_server;
        # listen [::]:80 default_server;
        # listen 443 ssl;
        # listen [::]:443 ssl;

        server_name localhost;
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
        # root /var/www/html;
    
        gzip  on;
        gzip_comp_level 9;
        gzip_min_length 1000;
        gzip_proxied off;
        gzip_types text/plain text/css application/xml+html application/javascript image/jpeg image/x-icon image/gif image/png video/jpeg;
        gzip_disable "MSIE [1-6]\.";

        # Serve React frontend static files
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;  # Handle React Router
            
            # try_files $uri $uri/ =404;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_pass          http://localhost/;
            proxy_read_timeout  90;
        }

        # Proxy API requests to Gin backend
        location /api/ {
            proxy_pass http://backend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}