services:
  # React frontend with live reload
  frontend:
    build:
      context: ../../todo-app
      dockerfile: Dockerfile.frontend
    volumes:
      - ../../todo-app:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "3000:3000" # Only exposed for development
    networks:
      - app-network

  # Golang Gin backend
  backend:
    build:
      context: ../../go-todos-api
      dockerfile: Dockerfile.backend
    volumes:
      - ../../go-todos-api:/go/src/app
    environment:
      - GOPATH=/go
      - GIN_MODE=debug
      - AIR_WORKDIR=/go/src/app
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=todos_db
    ports:
      - "8080:8080" # Only exposed for development - For external access if needed
    expose:
      - "8080" # For internal container access
    networks:
      - app-network
    depends_on:
      - frontend
      - db
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 5s

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app-network
    depends_on:
      - frontend
      - backend
      # frontend:
      #   condition: service_healthy
      # backend:
      #   condition: service_healthy

  # Database: MariaDB
  db:
    container_name: mariadb
    image: mariadb:latest
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=todos_db
    volumes:
      - ./mariadb/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mariadb/data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  app-network:
    driver: bridge
    attachable: true