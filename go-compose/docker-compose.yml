version: '3.8'

services:
  # Backend: Go Gin API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=gin_db
    volumes:
      - path_to_your_backend:/app
    depends_on:
      - db
    networks:
      - app-network

  # Database: MariaDB
  db:
    image: mariadb:latest
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=gin_db
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    volumes:
      - ./mariadb/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mariadb/data:/var/lib/mysql
    networks:
      - app-network

  # Frontend: React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    environment:
      - NODE_ENV=production  # Build static files for Nginx
    volumes:
      - path_to_your_frontend:/app
    networks:
      - app-network

  # Nginx: Reverse Proxy and Static File Server
  nginx:
    image: nginx:latest
    ports:
      - "80:80"  # Exposes Nginx on host port 80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf  # Mount custom config
      - path_to_your_frontend/build:/usr/share/nginx/html  # Mount React build files
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data: