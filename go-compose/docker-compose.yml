services:

  # Nginx: Reverse Proxy and Static File Server
  web:
    build: ./nginx
    ports:
      - "80:80"
    volumes:
      - ../../todo-app/build:/app/dist  # Mount React build files
      - ../../todo-app/build:/usr/share/nginx/html  # Mount React build files
    depends_on:
      - api
    networks:
      - app-network
  
  # Backend: Go Gin API
  api:
    build:
      context: ../../go-todos-api
      dockerfile: Dockerfile.backend
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=todos_db
    # volumes:
    #   - ../../go-todos-api:/app
    # depends_on:
    #   - db
    networks:
      - app-network

  # Frontend: React App
  frontend:
    build:
      context: ../../todo-app
      dockerfile: Dockerfile.frontend
    depends_on:
      - api
    networks:
      - app-network

  # Database: MariaDB
  # db:
  #   container_name: mariadb
  #   image: mariadb:latest
  #   environment:
  #     - MYSQL_ROOT_PASSWORD=rootpassword
  #     - MYSQL_DATABASE=todos_db
  #     - MYSQL_USER=user
  #     - MYSQL_PASSWORD=password
  #   volumes:
  #     - ./mariadb/my.cnf:/etc/mysql/conf.d/my.cnf:ro
  #     - ./mariadb/data:/var/lib/mysql
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data: